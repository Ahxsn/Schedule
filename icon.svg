<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#1e293b" stroke-width="4"/>
  <!-- Compass / Rocket / Crown Motif -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="12 12"/>
  <path d="M256 120 L330 350 L256 295 L182 350 Z" fill="url(#accent)" filter="url(#glow)"/>
  <circle cx="256" cy="235" r="28" fill="#ffffff"/>
  <circle cx="256" cy="235" r="14" fill="#0f172a"/>
</svg>

